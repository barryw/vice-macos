apiVersion: apps/v1
kind: Deployment
metadata:
  name: macvice-website
  labels:
    app.kubernetes.io/name: macvice-website
    app.kubernetes.io/component: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: macvice-website
      app.kubernetes.io/component: website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: macvice-website
        app.kubernetes.io/component: website
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Drain grace on voluntary disruption / rollout: give Traefik time to stop
      # routing to a terminating pod, then quit nginx gracefully. Matches the
      # ArgoCD-managed manifest this overlay is taking over from (WAL-163
      # de-ArgoCD cutover) so the single-owner CI deploy preserves ADR-0007
      # item 8 (never-down) — without it the cutover would regress to ~1.4% 502
      # on rollout. (ADR 0007 / WAL-148)
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: ghcr.io/barryw/macvice-website:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8; nginx -s quit"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
