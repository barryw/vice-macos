when:
  - event: push
    evaluate: 'CI_COMMIT_BRANCH == "main"'
    path:
      exclude:
        - website/**
        - k8s/**
        - .woodpecker/metal-ui.yaml
        - .woodpecker/website.yaml
  - event: push
    evaluate: 'CI_COMMIT_BRANCH == "main"'
    path:
      include:
        - website/**
        - k8s/**
        - .woodpecker/website.yaml
  - event: manual
    evaluate: 'CI_COMMIT_BRANCH == "main"'

labels:
  platform: linux/amd64

steps:
  - name: validate-static
    image: node:22-bookworm
    commands:
      - bash -n MacVICEKit/tools/validate-documentation-examples.sh
      - bash -n website/tools/validate-containerfile-pages.sh
      - bash -n website/tools/capture-marketing-screenshots.sh
      - bash MacVICEKit/tools/validate-documentation-examples.sh
      - bash website/tools/validate-containerfile-pages.sh
      - node --check website/site.js

  - name: wait-for-release
    image: node:22-bookworm
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
      VICE_MAC_WEBSITE_WAIT_FOR_RELEASE: "1"
    commands:
      - bash -n website/tools/wait-for-current-release.sh
      # WAL-125: mint a ~1h App token (contents=read) to read the latest release
      # in place of the shared admin PAT. node:22-bookworm ships bash+openssl+curl.
      - export GH_TOKEN="$(MINT_PERMS=contents=read,metadata=read bash ci/mint-token.sh)"
      - bash website/tools/wait-for-current-release.sh
    when:
      - event: push
        evaluate: 'CI_COMMIT_BRANCH == "main"'
        path:
          exclude:
            - website/**
            - k8s/**
            - .woodpecker/metal-ui.yaml
            - .woodpecker/website.yaml

  - name: validate-k8s
    image: bitnami/kubectl:latest
    commands:
      - kubectl apply -k k8s --dry-run=client
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-agent

  # WAL-122/125: mint a ~1h GitHub App installation token (ghcr-push profile,
  # packages=write) scoped to this repo, replacing the shared admin PAT for the
  # kaniko GHCR push below. Written to the shared workspace so the kaniko `debug`
  # (busybox) step — no bash/openssl/curl to mint inline — can read it.
  - name: mint-ghcr-token
    image: alpine:3.21
    depends_on:
      - validate-static
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
      MINT_PERMS: packages=write,metadata=read
    commands:
      - apk add --no-cache bash openssl curl > /dev/null 2>&1
      - bash ci/mint-token.sh > "$CI_WORKSPACE/.ghcr-token"
      - chmod 600 "$CI_WORKSPACE/.ghcr-token"

  - name: build-and-push
    image: gcr.io/kaniko-project/executor:debug
    depends_on:
      - validate-static
      - validate-k8s
      - wait-for-release
      - mint-ghcr-token
    environment:
      GHCR_USERNAME: barryw
      WEBSITE_IMAGE: ghcr.io/barryw/macvice-website
    commands:
      - |
        IMAGE_TAG="$(printf '%.12s' "$CI_COMMIT_SHA")"
        GHCR_TOKEN="$(cat "$CI_WORKSPACE/.ghcr-token")"
        mkdir -p /kaniko/.docker
        echo "{\"auths\":{\"ghcr.io\":{\"username\":\"$GHCR_USERNAME\",\"password\":\"$GHCR_TOKEN\"}}}" > /kaniko/.docker/config.json
        /kaniko/executor \
          --context="$CI_WORKSPACE/website" \
          --dockerfile="$CI_WORKSPACE/website/Containerfile" \
          --destination="$WEBSITE_IMAGE:$IMAGE_TAG" \
          --destination="$WEBSITE_IMAGE:latest" \
          --cache=true \
          --cache-repo="$WEBSITE_IMAGE-cache"

  - name: deploy
    image: bitnami/kubectl:latest
    depends_on:
      - build-and-push
    environment:
      WEBSITE_IMAGE: ghcr.io/barryw/macvice-website
    commands:
      - IMAGE_TAG="$(printf '%.12s' "$CI_COMMIT_SHA")"
      - kubectl apply -k k8s
      - kubectl -n default get secret ghcr-secret -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > /tmp/ghcr-dockerconfigjson
      - kubectl -n macvice create secret generic ghcr-secret --type=kubernetes.io/dockerconfigjson --from-file=.dockerconfigjson=/tmp/ghcr-dockerconfigjson --dry-run=client -o yaml | kubectl apply -f -
      - rm -f /tmp/ghcr-dockerconfigjson
      - kubectl -n macvice set image deployment/macvice-website "website=$WEBSITE_IMAGE:$IMAGE_TAG"
      - kubectl -n macvice rollout status deployment/macvice-website --timeout=180s
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-agent
