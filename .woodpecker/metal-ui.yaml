when:
  - event: push
    evaluate: 'CI_COMMIT_BRANCH == "macos/native-metal"'
  - event: manual
    evaluate: 'CI_COMMIT_BRANCH == "macos/native-metal"'
  - event: tag
    ref: refs/tags/vice-mac-*

labels:
  backend: local
  platform: darwin/arm64

steps:
  - name: prepare
    image: bash
    commands:
      - macos/scripts/ci-prepare.sh

  - name: verify
    image: bash
    commands:
      - macos/scripts/ci-test.sh

  - name: package
    image: bash
    environment:
      VICE_MAC_CODESIGN_IDENTITY:
        from_secret: apple_codesign_identity
      VICE_MAC_DEVELOPMENT_TEAM:
        from_secret: apple_development_team
      VICE_MAC_NOTARYTOOL_PROFILE:
        from_secret: apple_notarytool_profile
    commands:
      - macos/scripts/package-vicemac-release.sh
    when:
      - event: [push, manual, tag]

  - name: github-release
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - macos/scripts/publish-github-release.sh
    when:
      - event: [push, tag]
