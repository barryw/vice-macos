when:
  - event: push
    evaluate: 'CI_COMMIT_BRANCH == "main"'
    path:
      exclude:
        - website/**
        - deploy/**
        - .woodpecker/metal-ui.yaml
        - .woodpecker/woodpecker-template.yaml
  - event: manual
    evaluate: 'CI_COMMIT_BRANCH == "main"'

labels:
  backend: local
  platform: darwin/arm64

steps:
  - name: prepare
    image: bash
    commands:
      - macos/scripts/ci-prepare.sh

  - name: verify
    image: bash
    commands:
      - macos/scripts/ci-test.sh

  - name: package
    image: bash
    environment:
      VICE_MAC_CODESIGN_IDENTITY:
        from_secret: apple_codesign_identity
      VICE_MAC_DEVELOPMENT_TEAM:
        from_secret: apple_development_team
      VICE_MAC_NOTARYTOOL_PROFILE:
        from_secret: apple_notarytool_profile
    commands:
      - macos/scripts/package-vicemac-release.sh
    when:
      - event: [push, manual]

  - name: release-smoke
    image: bash
    commands:
      - macos/scripts/smoke-test-vicemac-dmg.sh
    when:
      - event: [push, manual]

  - name: github-release
    image: bash
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
      SPARKLE_PRIVATE_KEY:
        from_secret: sparkle_private_key
    commands:
      # WAL-74: mint a single-repo, ~1h GitHub App token (contents=write) on the
      # macOS local backend in place of the shared admin PAT. Vendored minter
      # (bash+openssl+curl, no jq) — the go plugin image can't execute here. The
      # publish script reads the token via GH_TOKEN.
      - export GH_TOKEN=$(bash ci/mint-token.sh)
      - macos/scripts/publish-github-release.sh
    when:
      - event: [push]
